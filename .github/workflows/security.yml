name: Security Scan

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install-hosted

      - name: Run audit
        run: pnpm audit --prod --audit-level=high

  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          set -euo pipefail
          VERSION=8.24.3
          SHA256=9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
          CACHE_DIR="${HOME}/.cache/gitleaks/${VERSION}-linux-x64"
          if [ ! -x "${CACHE_DIR}/gitleaks" ]; then
            mkdir -p "${CACHE_DIR}"
            curl -sSL -o "${RUNNER_TEMP}/gitleaks.tar.gz" \
              "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
            echo "${SHA256}  ${RUNNER_TEMP}/gitleaks.tar.gz" | sha256sum -c -
            tar -xz -C "${CACHE_DIR}" -f "${RUNNER_TEMP}/gitleaks.tar.gz" gitleaks
          fi
          echo "${CACHE_DIR}" >> "$GITHUB_PATH"

      - name: Resolve the commit range to scan
        id: range
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            git cat-file -e "${BASE_SHA}^{commit}"
            echo "log_opts=${BASE_SHA}..HEAD" >> "$GITHUB_OUTPUT"
          else
            echo "log_opts=HEAD" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Gitleaks
        env:
          LOG_OPTS: ${{ steps.range.outputs.log_opts }}
        run: gitleaks detect --redact --exit-code=2 --log-opts="${LOG_OPTS}"

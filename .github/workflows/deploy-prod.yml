name: Deploy Production

on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  check-ci:
    name: Verify CI passed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Production deploys run from main only (ref: $REF)"
            exit 1
          fi
      - name: Check CI status for this commit
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-cd.yml',
              head_sha: context.sha,
              per_page: 30,
            });
            const ok = data.workflow_runs.some(
              (r) => r.conclusion === 'success' && r.event === 'push',
            );
            if (!ok) {
              core.setFailed(
                `No successful push CI run for commit ${context.sha}. Push to main and let CI pass before deploying.`,
              );
            }

  security:
    name: Scan deployment target
    needs: [check-ci]
    uses: ./.github/workflows/security.yml
    with:
      ref: ${{ github.sha }}

  deploy:
    name: Deploy (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-ci, security]
    environment:
      name: production
    env:
      HAS_ELEVENLABS: ${{ secrets.ELEVENLABS_API_KEY != '' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false
      - uses: ./.github/actions/pnpm-install-hosted
      - name: Build
        run: CLOUDFLARE_ENV=production pnpm build
      - name: The production build ships the assistant binding and no scripted model
        run: |
          if grep -rq FAKE_ASSISTANT_SENTINEL dist/server; then
            echo "::error::The scripted chat model reached the production server bundle (assistant.model must not be 'fake')"
            exit 1
          fi
          node -e "const c=require('./dist/server/wrangler.json'); if (c.ai?.binding!=='AI' || !c.ratelimits?.some((r)=>r.name==='CHAT_LIMITER')) { console.error('::error::dist/server/wrangler.json lacks the AI binding or CHAT_LIMITER'); process.exit(1); }"
      - name: The production build ships the voice bindings and no scripted voice SDK
        run: |
          if grep -rq FAKE_VOICE_SENTINEL dist/client dist/server; then
            echo "::error::The scripted voice SDK reached the production bundle (voice.fakeSdk must be false)"
            exit 1
          fi
          node -e "const c=require('./dist/server/wrangler.json'); if (!c.secrets_store_secrets?.some((s)=>s.binding==='ELEVENLABS_API_KEY') || !c.ratelimits?.some((r)=>r.name==='VOICE_LIMITER')) { console.error('::error::dist/server/wrangler.json lacks the ELEVENLABS_API_KEY secret or VOICE_LIMITER'); process.exit(1); }"
      - name: Apply D1 migrations (expand-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler d1 migrations apply DB --remote --env production
      - name: Deploy
        uses: ./.github/actions/wrangler-deploy-retry
        with:
          working-directory: .
          args: --config dist/server/wrangler.json
          api-token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Smoke test
        run: bash scripts/smoke.sh
      - name: Sync ElevenLabs agents
        if: ${{ env.HAS_ELEVENLABS == 'true' }}
        continue-on-error: true
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: node scripts/voice-agent.mjs apply --update-only || echo "::warning::The ElevenLabs agent sync failed; run pnpm voice:apply by hand"
      - name: ElevenLabs sync skipped
        if: ${{ env.HAS_ELEVENLABS != 'true' }}
        run: echo "::notice::ELEVENLABS_API_KEY is not set for the production environment, so the voice agents were not synced"
      - name: Sitemap walk
        env:
          PLAYWRIGHT_BASE_URL: https://zenetlabs.com
        run: pnpm exec playwright test e2e/sitemap.e2e.ts
      - name: Rollback command
        if: ${{ failure() }}
        run: |
          {
            echo "### Deploy or smoke test failed"
            echo
            echo 'Roll back with:'
            echo
            echo '```'
            echo 'pnpm exec wrangler rollback --name prod-zenet-web'
            echo '```'
            echo
            echo 'If the D1 migrations step failed with an authentication error, the deploy token lacks Account · D1 · Edit. Nothing was deployed.'
          } >> "$GITHUB_STEP_SUMMARY"

name: "pnpm install (hosted)"
description: >
  Install the pinned Node and pnpm versions on a fresh GitHub-hosted VM.
  Validation and deployment never share a host, package store, or credentials.

inputs:
  working-directory:
    description: >
      Workspace root to install in. Defaults to the checkout root; set it
      when a job needs the install to run somewhere other than repo root.
    required: false
    default: "."

runs:
  using: composite
  steps:
    # pnpm version is READ FROM package.json, same as pnpm-install-local — one
    # place a pnpm bump has to land.
    - name: Enable pnpm via corepack
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        corepack enable
        corepack prepare --activate "$(node -p 'require("./package.json").packageManager')"
        pnpm --version

    - name: Setup Node
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
